[project]
name = "field-shift"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "explorer"]
# also run the examples in docstrings (>>> ...), so they cannot go stale
addopts = "--doctest-modules"
